<div class="mb-3"><label class="form-label fw-semibold" for="title">Title *</label><input id="title" name="title" class="form-control {{ 'is-invalid' if errors.get('title') else '' }}" required maxlength="160" value="{{ values.get('title', '') }}" placeholder="e.g. Mathematics written exam"><div class="invalid-feedback">{{ errors.get('title', '') }}</div></div>
<div class="row g-3 mb-3"><div class="col-md-6"><label for="subject_id" class="form-label fw-semibold">Subject *</label><select class="form-select {{ 'is-invalid' if errors.get('subject_id') else '' }}" id="subject_id" name="subject_id" required><option value="">Select Subject</option>{% for subject in subjects %}<option value="{{ subject.id }}" {% if values.get('subject_id','')|string == subject.id|string %}selected{% endif %}>{{ subject.name }}</option>{% endfor %}</select><div class="invalid-feedback">{{ errors.get('subject_id', '') }}</div></div><div class="col-md-6"><label for="location" class="form-label fw-semibold">Location</label><input class="form-control {{ 'is-invalid' if errors.get('location') else '' }}" id="location" name="location" maxlength="160" value="{{ values.get('location','') }}" placeholder="Room 101"><div class="invalid-feedback">{{ errors.get('location','') }}</div></div></div>
<div class="row g-3 mb-3"><div class="col-md-6"><label for="exam_date" class="form-label fw-semibold">Date *</label><input class="form-control {{ 'is-invalid' if errors.get('exam_date') else '' }}" id="exam_date" name="exam_date" type="date" required value="{{ values.get('exam_date','') }}"><div class="invalid-feedback">{{ errors.get('exam_date','') }}</div></div><div class="col-md-6"><label for="exam_time" class="form-label fw-semibold">Time *</label><input class="form-control {{ 'is-invalid' if errors.get('exam_time') else '' }}" id="exam_time" name="exam_time" type="time" required value="{{ values.get('exam_time','') }}"><div class="invalid-feedback">{{ errors.get('exam_time','') }}</div></div></div>
<div class="mb-3"><label for="status" class="form-label fw-semibold">Status</label><select id="status" name="status" class="form-select {{ 'is-invalid' if errors.get('status') else '' }}">{% for key,label in [('upcoming','Upcoming'),('completed','Completed'),('cancelled','Cancelled')] %}<option value="{{ key }}" {% if values.get('status','upcoming') == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><div class="invalid-feedback">{{ errors.get('status','') }}</div></div>
<div class="mb-3"><label for="description" class="form-label fw-semibold">Description</label><textarea id="description" name="description" maxlength="2000" rows="3" class="form-control {{ 'is-invalid' if errors.get('description') else '' }}" placeholder="Exam topics, important notes...">{{ values.get('description','') }}</textarea><div class="invalid-feedback">{{ errors.get('description','') }}</div></div>
