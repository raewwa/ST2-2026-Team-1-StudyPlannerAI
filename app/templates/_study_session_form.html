<div class="mb-3"><label class="form-label fw-semibold" for="title">Заглавие *</label><input class="form-control {{ 'is-invalid' if errors.get('title') else '' }}" id="title" name="title" required maxlength="160" value="{{ values.get('title','') }}" placeholder="Преговор по математика"><div class="invalid-feedback">{{ errors.get('title','') }}</div></div>
<div class="row g-3 mb-3"><div class="col-md-6"><label for="subject_id" class="form-label fw-semibold">Предмет *</label><select class="form-select {{ 'is-invalid' if errors.get('subject_id') else '' }}" id="subject_id" name="subject_id" required><option value="">Избери предмет</option>{% for subject in subjects %}<option value="{{ subject.id }}" {% if values.get('subject_id','')|string == subject.id|string %}selected{% endif %}>{{ subject.name }}</option>{% endfor %}</select><div class="invalid-feedback">{{ errors.get('subject_id','') }}</div></div><div class="col-md-6"><label for="session_date" class="form-label fw-semibold">Дата *</label><input class="form-control {{ 'is-invalid' if errors.get('session_date') else '' }}" type="date" id="session_date" name="session_date" required value="{{ values.get('session_date','') }}"><div class="invalid-feedback">{{ errors.get('session_date','') }}</div></div></div>
<div class="row g-3 mb-3"><div class="col-md-6"><label for="start_time" class="form-label fw-semibold">Начален час *</label><input class="form-control {{ 'is-invalid' if errors.get('start_time') else '' }}" type="time" id="start_time" name="start_time" required value="{{ values.get('start_time','') }}"><div class="invalid-feedback">{{ errors.get('start_time','') }}</div></div><div class="col-md-6"><label for="end_time" class="form-label fw-semibold">Краен час *</label><input class="form-control {{ 'is-invalid' if errors.get('end_time') else '' }}" type="time" id="end_time" name="end_time" required value="{{ values.get('end_time','') }}"><div class="invalid-feedback">{{ errors.get('end_time','') }}</div></div></div>
<div class="mb-3"><label for="status" class="form-label fw-semibold">Статус</label><select class="form-select {{ 'is-invalid' if errors.get('status') else '' }}" id="status" name="status">{% for key,label in [('planned','Планирана'),('completed','Завършена'),('cancelled','Отменена')] %}<option value="{{ key }}" {% if values.get('status','planned') == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><div class="invalid-feedback">{{ errors.get('status','') }}</div></div>
<div class="mb-3"><label for="description" class="form-label fw-semibold">Описание</label><textarea class="form-control {{ 'is-invalid' if errors.get('description') else '' }}" id="description" name="description" maxlength="2000" rows="3">{{ values.get('description','') }}</textarea><div class="invalid-feedback">{{ errors.get('description','') }}</div></div>
