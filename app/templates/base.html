<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Study Planner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}"><i class="bi bi-journal-bookmark me-2" aria-hidden="true"></i>AI Study Planner</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavigation" aria-controls="appNavigation" aria-expanded="false" aria-label="Отвори навигацията"><span class="navbar-toggler-icon"></span></button>
    </div>
  </header>
  <div class="app-layout">
    <nav id="appNavigation" class="collapse navbar-collapse app-sidebar" aria-label="Основна навигация">
      <div class="nav nav-pills flex-column gap-1 p-3 w-100">
        <a class="nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}"><i class="bi bi-grid-1x2 me-2" aria-hidden="true"></i>Табло</a>
        <a class="nav-link {% if request.endpoint == 'main.subjects' %}active{% endif %}" href="{{ url_for('main.subjects') }}"><i class="bi bi-book me-2" aria-hidden="true"></i>Предмети</a>
        <a class="nav-link {% if request.endpoint == 'main.tasks' %}active{% endif %}" href="{{ url_for('main.tasks') }}"><i class="bi bi-check2-square me-2" aria-hidden="true"></i>Задачи</a>
        <a class="nav-link {% if request.endpoint == 'main.exams' %}active{% endif %}" href="{{ url_for('main.exams') }}"><i class="bi bi-pencil-square me-2" aria-hidden="true"></i>Изпити</a>
        <a class="nav-link {% if request.endpoint == 'main.schedule' %}active{% endif %}" href="{{ url_for('main.schedule') }}"><i class="bi bi-calendar-week me-2" aria-hidden="true"></i>График</a>
        <hr class="my-2">
        <a class="nav-link {% if request.endpoint == 'main.login' %}active{% endif %}" href="{{ url_for('main.login') }}"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Вход</a>
        <a class="nav-link {% if request.endpoint == 'main.register' %}active{% endif %}" href="{{ url_for('main.register') }}"><i class="bi bi-person-plus me-2" aria-hidden="true"></i>Регистрация</a>
      </div>
    </nav>
    <main class="app-content container-fluid py-4 py-lg-5 px-3 px-lg-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Затвори"></button></div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
